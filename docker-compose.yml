name: wired-mind

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: app
    image: wired-mind/php:latest
    restart: unless-stopped
    environment:
      APP_NAME: "Wired Mind"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: "base64:iqoYP9cWVEEX9LbhkDygOdbRQ73pGi8OleT1MFCgFYg="
      APP_URL: "http://localhost:${APP_PORT:-8080}"
      APP_LOCALE: en
      APP_FALLBACK_LOCALE: en
      LOG_CHANNEL: stderr
      LOG_LEVEL: debug
      BCRYPT_ROUNDS: "12"

      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: "${DB_DATABASE:-wired_mind}"
      DB_USERNAME: "${DB_USERNAME:-laravel}"
      DB_PASSWORD: "${DB_PASSWORD:-secret}"

      SESSION_DRIVER: redis
      SESSION_LIFETIME: "120"
      CACHE_STORE: redis
      QUEUE_CONNECTION: sync

      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      REDIS_CACHE_DB: "1"

      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@example.com}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-password}"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app

  web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    image: wired-mind/nginx:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      - app
    networks:
      - app

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-wired_mind}"
      MYSQL_USER: "${DB_USERNAME:-laravel}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-secret}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root}"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - app

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - app

volumes:
  mysql-data:
  redis-data:

networks:
  app:
    driver: bridge
    # Фиксированная подсеть: не зависит от исчерпания пула адресов Docker.
    # При конфликте с существующей сетью замените подсеть.
    ipam:
      config:
        - subnet: 172.30.0.0/24
